appId: org.wikipedia.dev
name: WikiGames plays a full game on a day with only 3 events (recycled pairing)
tags:
  - wikigames
---
# State is seeded by run-wikigames-recycled.sh: onboarding suppressed and the
# REST API pointed at the local fixture server, which serves only 3 usable
# On This Day events. Pre-fix (4824d3a9f7) the pairing loop ran out of events
# after question 2 and crashed (removeAt on an empty list) into the stuck error
# page. With the fix, events are recycled from a copy of the pool
# (allEventsCopy[index % size] for event1, any different-year copy event as the
# partner fallback), so the day yields a full 5-question game.
- launchApp
- extendedWaitUntil:
    visible: "Which came first?"
    timeout: 30000
# Dismiss the first-run feed announcement if present so snackbars can't overlap.
- runFlow:
    when:
      visible: "Got it"
    commands:
      - tapOn: "Got it"
      - extendedWaitUntil:
          notVisible: "Card hidden."
          timeout: 10000
- takeScreenshot: .maestro/screenshots/android-wikigames-recycled-card
- tapOn: "Which came first?"
# Game menu must load (events fetched + paired) instead of the error view.
- extendedWaitUntil:
    visible: "Play today's game"
    timeout: 15000
- assertNotVisible: "An error occurred"
- takeScreenshot: .maestro/screenshots/android-wikigames-recycled-menu
- tapOn: "Play today's game"

# ---- Question 1 ----
- extendedWaitUntil:
    visible:
      id: ".*questionCard1"
    timeout: 10000
- takeScreenshot: .maestro/screenshots/android-wikigames-recycled-q1
- tapOn:
    id: ".*questionCard1"
- tapOn: "Submit"
- extendedWaitUntil:
    visible: "Next question"
    timeout: 10000
- takeScreenshot: .maestro/screenshots/android-wikigames-recycled-q1-revealed
- tapOn: "Next question"

# ---- Questions 2-4: pool exhausted, every pair is recycled ----
- repeat:
    times: 3
    commands:
      - extendedWaitUntil:
          visible:
            id: ".*questionCard1"
          timeout: 10000
      - assertNotVisible: "An error occurred"
      - tapOn:
          id: ".*questionCard1"
      - tapOn: "Submit"
      - extendedWaitUntil:
          visible: "Next question"
          timeout: 10000
      - tapOn: "Next question"

# ---- Question 5: still a real recycled pair, no error, no blank card ----
- extendedWaitUntil:
    visible:
      id: ".*questionCard1"
    timeout: 10000
- assertNotVisible: "An error occurred"
- takeScreenshot: .maestro/screenshots/android-wikigames-recycled-q5
- tapOn:
    id: ".*questionCard1"
- tapOn: "Submit"
# Last question reveals "Final results" instead of "Next question".
- extendedWaitUntil:
    visible: "Final results"
    timeout: 10000
- takeScreenshot: .maestro/screenshots/android-wikigames-recycled-q5-revealed
- tapOn: "Final results"

# ---- Results: the 3-event day completed instead of locking on the error page ----
- extendedWaitUntil:
    visible: "You scored.*"
    timeout: 15000
- assertNotVisible: "An error occurred"
- takeScreenshot: .maestro/screenshots/android-wikigames-recycled-results
