appId: org.wikipedia.dev
name: Hybrid search onboarding and example-query search (experiment group B)
tags:
  - mock
  - hybrid-search
---
# Prerequisites (handled by run-hybrid-search.sh):
#   - fixture server on host port 8081 (lexical + semantic + remote config routes)
#   - state seeded: onboarding suppressed, ab_test_hybridSearch=1 (lexicalSemantic),
#     hybridSearchOnboardingShown=false, base URIs pointed at the fixture server
# Do NOT use clearState here — it would wipe the seeded preferences.
- launchApp
- tapOn:
    id: ".*:id/nav_tab_search"
# Opening search (via the search card) intercepts with the hybrid onboarding.
- tapOn: "Search Wikipedia"
- assertVisible: "A new way to search"
- assertVisible: "Beta"
- assertVisible: "Ask questions, get answers"
- assertVisible: "Need inspiration?"
- takeScreenshot: .maestro/screenshots/android-hybrid-onboarding
# Learn More opens the info page in an external browser and logs
# click/learn_more (was learn_button before b7745030f3); the onboarding
# activity stays beneath, so back returns to it.
- tapOn: "Learn more"
# Chrome cold-starts can be slow; the first-ever launch additionally shows a
# first-run screen (dismiss it once per emulator: "Use without an account").
- extendedWaitUntil:
    notVisible: "Need inspiration?"
    timeout: 25000
- takeScreenshot: .maestro/screenshots/android-hybrid-onboarding-learn-more-browser
# Foreground the app again (back inside Chrome only navigates browser history);
# the onboarding activity is still on top of the app's task.
- launchApp:
    appId: org.wikipedia.dev
    stopApp: false
- extendedWaitUntil:
    visible: "A new way to search"
    timeout: 10000
- tapOn: "When was Pluto unlisted as a planet?"
# Example query launches SearchActivity with the query and starts a hybrid search.
- extendedWaitUntil:
    visible: "Sourced from human generated Wikipedia articles"
    timeout: 15000
- takeScreenshot: .maestro/screenshots/android-hybrid-results-from-onboarding
# Group B = lexical results first; scroll down to the semantic cards.
- scrollUntilVisible:
    element: "Rate this result"
- assertVisible: "Pluto"
- takeScreenshot: .maestro/screenshots/android-hybrid-results-semantic-cards
