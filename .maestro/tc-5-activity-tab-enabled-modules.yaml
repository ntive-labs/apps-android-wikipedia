appId: org.wikipedia.dev
name: "TC5 - Enabled Activity tab modules are shown"
tags:
  - android
  - activity-tab
  - modules
---
# =============================================================================
# Test case 5: Enabled Activity tab modules are shown
# User story: "Show enabled Activity Tab Modules"
#
# GIVEN
#   G0  The user is signed in
#   G1  Activity data is mocked so a stored donation exists and edit and reading
#       activity is present
# WHEN
#   W0  Open the Activity tab
# THEN
#   T0  The Donation History module is visible
#   T1  Modules disabled in customization are not rendered
#
# Start screen: the Activity tab (ActivityTabFragment inside MainActivity).
#
# HOW THE GIVENS ARE MET
#   G0  The app is pointed at a local mock MediaWiki backend through the debug-only launch-arg
#       seam (org.wikipedia.settings.AppConfig) and signed in through the Activity tab's own
#       logged-out call to action. The mock answers action=clientlogin with PASS.
#   G1  Two halves, because the Activity tab reads from two places:
#         - locally stored data (a donation in Prefs.donationResults, plus read articles and
#           time spent in the history database) is seeded by the `mockActivityData` launch
#           argument, since no API can supply it;
#         - edit activity (the GrowthExperiments impact payload and list=usercontribs, which
#           feed the impact / editing insights modules and the edit half of the timeline) comes
#           from the mock backend.
#       Both halves are verified below rather than assumed: the donation shows up as the
#       "Last in app donation" row on the customization screen (that row only renders when
#       Prefs.donationResults is non-empty), and the impact, editing insights and timeline
#       modules are all asserted to render before anything is switched off.
#
# WHICH MODULES ARE DISABLED, AND WHY THE FLOW HAS TO CUSTOMIZE AT ALL
#   T0 and T1 pull in opposite directions, and Android's defaults (ActivityTabModules) satisfy
#   neither: DONATIONS starts disabled and every other module starts enabled. So the flow
#   drives the real customization screen once, before the When step:
#
#     enabled      DONATIONS         -> required by T0
#                  TIME_SPENT, READING_INSIGHTS (untouched defaults, used as positive controls)
#     disabled     EDITING_INSIGHTS, IMPACT, TIMELINE  -> the "modules disabled in
#                  customization" of T1
#
#   Each disabled module is proven to render *before* it is switched off, so the T1 assertions
#   cannot pass vacuously.
#
# REQUIRED ENV
#   This flow declares no `env:` block on purpose - a flow's own `env` shadows what a caller
#   passes. Every variable below comes from the tc-5-...-set<N>.yaml wrapper:
#
#     SET_INDEX            parameter set index, used in the screenshot file names ("0")
#     USERNAME / PASSWORD  credentials the mock backend accepts
#     SHOTS                screenshot output directory, relative to the repo root
#     API_BASE_URL         the mock backend as seen from the device ("http://10.0.2.2:8080")
#
# HOW TO RUN
#   1. Start the mock backend on the host:
#        MOCK_USERNAME=maestro-user MOCK_PASSWORD=correct-horse-battery \
#          python3 .maestro/mock/activity_tab_server.py
#   2. Install a *debug* build (the launch-arg seam is gated on BuildConfig.DEBUG):
#        ./gradlew assembleDevDebug
#        adb install -r app/build/outputs/apk/dev/debug/app-dev-debug.apk
#   3. maestro test .maestro/tc-5-activity-tab-enabled-modules-set0.yaml
#   Or simply: .maestro/run-tc-5.sh   (does all of the above)
#
# Screenshots land in .maestro/screenshots/ as tc-5-set<S>-start.png,
# tc-5-set<S>-when<W>-before.png and tc-5-set<S>-when<W>-after.png.
# =============================================================================

# -----------------------------------------------------------------------------
# Launch: mock backend + seeded local activity data.
# -----------------------------------------------------------------------------
- launchApp:
    clearState: true
    permissions:
      # Pre-grant notifications: the app asks for POST_NOTIFICATIONS during onboarding and again
      # right after a successful login, and that system dialog would otherwise cover the screen
      # the flow is working on.
      all: deny
      notifications: allow
    arguments:
      apiBaseUrl: "${API_BASE_URL}"
      disableCertPinning: true
      mockActivityData: true
    label: "Launch a freshly-cleared app on the mock backend with seeded activity data"
- waitForAnimationToEnd:
    timeout: 10000

# A cleared app shows the intro pager (two variants: "Forward" arrows on first launch after
# install, "Skip"/"Next" on the topic-personalisation pager). Android 13+ also raises the
# notifications permission dialog part-way through. Dismiss all of them, best-effort.
- repeat:
    times: 10
    label: "Dismiss first-run onboarding and any permission dialogs"
    commands:
      - runFlow:
          when:
            visible: "Don.t allow|Allow|While using the app|No thanks"
          commands:
            - tapOn: "Don.t allow|Allow|While using the app|No thanks"
      - runFlow:
          when:
            visible: "Skip|Forward|Next|Get started"
          commands:
            - tapOn: "Skip|Forward|Next|Get started"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible:
      id: "org.wikipedia.dev:id/nav_tab_edits"
    timeout: 30000
    label: "Onboarding dismissed, main screen reached"

# The very first visit to the Activity tab pushes ActivityTabOnboardingActivity in front of it.
- tapOn:
    id: "org.wikipedia.dev:id/nav_tab_edits"
- waitForAnimationToEnd:
    timeout: 6000
- runFlow:
    when:
      visible: "Introducing Activity"
    label: "Dismiss the one-time Activity tab onboarding"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd:
          timeout: 8000

# -----------------------------------------------------------------------------
# GIVEN G0 - the user is signed in.
#
# `clearState` wipes app data but NOT the AccountManager account, so a device that ran this flow
# before is still signed in. Log in only when the logged-out call to action is actually showing;
# either way G0 is verified below.
# -----------------------------------------------------------------------------
- runFlow:
    when:
      visible:
        id: "activity_tab_logged_out"
    label: "GIVEN G0: sign in through the Activity tab's logged-out call to action"
    commands:
      - tapOn: "Log in"
      - extendedWaitUntil:
          visible:
            id: "org.wikipedia.dev:id/login_button"
          timeout: 20000
      - tapOn:
          id: "org.wikipedia.dev:id/login_username_text"
      - inputText: "${USERNAME}"
      - tapOn:
          id: "org.wikipedia.dev:id/login_password_input"
      - inputText: "${PASSWORD}"
      - tapOn:
          id: "org.wikipedia.dev:id/login_button"
      - waitForAnimationToEnd:
          timeout: 8000
      # On a device where notifications were never granted the app re-asks right after login.
      - runFlow:
          when:
            visible: "Don.t allow|Allow|While using the app|No thanks"
          commands:
            - tapOn: "Don.t allow|Allow|While using the app|No thanks"
      - extendedWaitUntil:
          visible:
            id: "org.wikipedia.dev:id/nav_tab_edits"
          timeout: 30000

# Returning from the Activity tab onboarding leaves MainActivity's toolbar hidden (it is only
# re-shown by onTabChanged), so bounce through Home once to bring the toolbar - and with it the
# overflow menu that opens the customization screen - on screen.
- tapOn:
    id: "org.wikipedia.dev:id/nav_tab_home"
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "org.wikipedia.dev:id/nav_tab_edits"
- extendedWaitUntil:
    visible:
      id: "org.wikipedia.dev:id/empty"
    timeout: 20000
    label: "Activity tab with its overflow menu is on screen"

# G0 verified: the tab renders the signed-in dashboard, headed by the signed-in user's name,
# instead of the logged-out call to action.
- assertNotVisible:
    id: "activity_tab_logged_out"
    label: "GIVEN G0 verified: the logged-out Activity tab state is gone"
- extendedWaitUntil:
    visible: "${USERNAME}.s reading"
    timeout: 20000
    label: "GIVEN G0 verified: signed in as ${USERNAME}"

# -----------------------------------------------------------------------------
# GIVEN G1 (part 1) - reading and edit activity is present, and every module the flow will
# later switch off does render right now. Without this baseline the T1 assertions would pass
# for a module that was never there in the first place.
# -----------------------------------------------------------------------------
- assertVisible:
    id: "activity_tab_module_reading_insights"
    label: "GIVEN G1 verified: reading activity renders (articles read this month card)"
- scrollUntilVisible:
    element:
      id: "activity_tab_module_editing_insights"
    direction: DOWN
    timeout: 30000
    centerElement: true
    label: "GIVEN G1 verified: edit activity renders (editing insights module)"
- scrollUntilVisible:
    element:
      id: "activity_tab_module_impact"
    direction: DOWN
    timeout: 30000
    centerElement: true
    label: "Baseline: the impact module IS shown before customization"
- scrollUntilVisible:
    element:
      id: "activity_tab_module_timeline"
    direction: DOWN
    timeout: 30000
    centerElement: true
    label: "Baseline: the timeline module IS shown before customization"
- scrollUntilVisible:
    element: "${USERNAME}.s reading"
    direction: UP
    timeout: 20000
    label: "Back to the top of the Activity tab"

# -----------------------------------------------------------------------------
# Customization: turn the Donation History module on, and turn off the three modules whose
# absence T1 checks. The overflow submenu rows carry no per-item id, so the first row
# (Customize) is addressed by the menu row title id plus its index.
# -----------------------------------------------------------------------------
- tapOn:
    id: "org.wikipedia.dev:id/empty"
    label: "Open the Activity tab overflow menu"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "org.wikipedia.dev:id/title"
    index: 0
    label: "Open Customize (first overflow menu entry)"
- extendedWaitUntil:
    visible:
      id: "activity_tab_customize_switch_impact"
    timeout: 20000
    label: "Activity tab customization screen"
- waitForAnimationToEnd:
    timeout: 2000

# GIVEN G1 (part 2) - the seeded donation really is stored: the customization screen renders the
# donations row only when Prefs.donationResults is non-empty.
- assertVisible:
    id: "activity_tab_customize_switch_donations"
    label: "GIVEN G1 verified: a stored donation exists (donations row is offered at all)"
- assertVisible:
    id: "activity_tab_customize_switch_donations"
    checked: false
    label: "Donations start disabled (ActivityTabModules default)"
- tapOn:
    id: "activity_tab_customize_switch_donations"
    label: "Enable the Donation History module"
- assertVisible:
    id: "activity_tab_customize_switch_donations"
    checked: true

- tapOn:
    id: "activity_tab_customize_switch_editing_insights"
    label: "Disable the editing insights module"
- assertVisible:
    id: "activity_tab_customize_switch_editing_insights"
    checked: false
- tapOn:
    id: "activity_tab_customize_switch_impact"
    label: "Disable the impact module"
- assertVisible:
    id: "activity_tab_customize_switch_impact"
    checked: false
- tapOn:
    id: "activity_tab_customize_switch_timeline"
    label: "Disable the timeline module"
- assertVisible:
    id: "activity_tab_customize_switch_timeline"
    checked: false

# The modules that must stay on are untouched.
- assertVisible:
    id: "activity_tab_customize_switch_time_spent"
    checked: true
    label: "Time spent reading stays enabled"
- assertVisible:
    id: "activity_tab_customize_switch_reading_insights"
    checked: true
    label: "Reading insights stays enabled"
- takeScreenshot:
    path: "${SHOTS}/tc-5-set${SET_INDEX}-customization"

# Back to the start screen: the Activity tab.
- back
- extendedWaitUntil:
    visible:
      id: "org.wikipedia.dev:id/nav_tab_edits"
    timeout: 20000
- extendedWaitUntil:
    visible: "${USERNAME}.s reading"
    timeout: 20000
    label: "Start screen reached: the Activity tab, every Given satisfied"
- waitForAnimationToEnd:
    timeout: 4000

# START STATE - every Given holds and the start screen is visible.
- takeScreenshot:
    path: "${SHOTS}/tc-5-set${SET_INDEX}-start"

# =============================================================================
# WHEN W0 - Open the Activity tab.
#
# The flow starts on the Activity tab (the case's start screen), so to actually *open* it the
# flow steps away to Home first and then opens the Activity tab from there. That is also what
# makes the step meaningful: MainActivity re-selects the tab, ActivityTabFragment.onResume()
# re-runs loadAll(), and the module list is rebuilt from Prefs.activityTabModules /
# Prefs.donationResults.
#
# The "before" screenshot therefore shows the Explore feed, and that feed shows its offline
# error ("Unable to resolve host en.10.0.2.2"): the feed asks a *language-prefixed* host, which
# the apiBaseUrl override collapses onto the mock's bare host. Only the Activity tab's own
# traffic is mocked, and none of this case's Givens or Thens involve the feed.
# =============================================================================
- tapOn:
    id: "org.wikipedia.dev:id/nav_tab_home"
    label: "Step away from the Activity tab so it can be opened"
- extendedWaitUntil:
    notVisible: "${USERNAME}.s reading"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot:
    path: "${SHOTS}/tc-5-set${SET_INDEX}-when0-before"
- tapOn:
    id: "org.wikipedia.dev:id/nav_tab_edits"
    label: "WHEN W0: open the Activity tab"
- extendedWaitUntil:
    visible: "${USERNAME}.s reading"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot:
    path: "${SHOTS}/tc-5-set${SET_INDEX}-when0-after"

# =============================================================================
# THEN T0 - The Donation History module is visible.
#
# The module renders only when DONATIONS is enabled AND Prefs.donationResults is non-empty
# (ActivityTabModules.isModuleVisible), and it shows how long ago that stored donation was -
# the seed is 3 days old, so the card reads "3 days ago".
# =============================================================================
- scrollUntilVisible:
    element:
      id: "activity_tab_module_donations"
    direction: DOWN
    timeout: 30000
    centerElement: true
    label: "THEN T0: the Donation History module is on the Activity tab"
- assertVisible:
    id: "activity_tab_module_donations"
    label: "THEN T0: the Donation History module is visible"
- assertVisible:
    text: "3 days ago"
    label: "THEN T0: it shows the stored donation (seeded 3 days ago)"
- takeScreenshot:
    path: "${SHOTS}/tc-5-set${SET_INDEX}-then0-donation-module"

# =============================================================================
# THEN T1 - Modules disabled in customization are not rendered.
#
# Walk the whole tab from top to bottom, asserting after every scroll step that none of the
# three switched-off modules is on screen. A single assertion would pass vacuously for a module
# that lives below the fold, which is why this sweeps the entire scroll range - the same range
# the baseline scrollUntilVisible calls above proved each module was reachable in.
# =============================================================================
- scrollUntilVisible:
    element: "${USERNAME}.s reading"
    direction: UP
    timeout: 20000
    label: "Back to the top of the Activity tab"
- repeat:
    times: 8
    label: "THEN T1: sweep the Activity tab - no disabled module may appear"
    commands:
      - assertNotVisible:
          id: "activity_tab_module_editing_insights"
      - assertNotVisible:
          id: "activity_tab_module_impact"
      - assertNotVisible:
          id: "activity_tab_module_timeline"
      - scroll
      - waitForAnimationToEnd:
          timeout: 1500
- assertNotVisible:
    id: "activity_tab_module_editing_insights"
    label: "THEN T1: the editing insights module is not rendered"
- assertNotVisible:
    id: "activity_tab_module_impact"
    label: "THEN T1: the impact module is not rendered"
- assertNotVisible:
    id: "activity_tab_module_timeline"
    label: "THEN T1: the timeline module is not rendered"

# ... while the modules that stayed enabled are still rendered, so T1 is about the disabled
# ones only and not about an Activity tab that failed to load.
- scrollUntilVisible:
    element:
      id: "activity_tab_module_reading_insights"
    direction: UP
    timeout: 20000
    label: "THEN T1: enabled modules are unaffected (reading insights still renders)"
- assertVisible:
    id: "activity_tab_module_reading_insights"
- takeScreenshot:
    path: "${SHOTS}/tc-5-set${SET_INDEX}-then1-disabled-modules-absent"
