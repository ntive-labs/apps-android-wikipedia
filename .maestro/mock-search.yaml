appId: org.wikipedia.dev
name: Search against local fixture server
tags:
  - mock
---
# Prerequisites (handled by run-mock-search.sh):
#   - fixture server running on host port 8081
#   - app state seeded via TestSetupReceiver: onboarding suppressed,
#     API base URL pointed at http://10.0.2.2:8081
# Do NOT use clearState here — it would wipe the seeded preferences.
- launchApp
- tapOn:
    id: ".*:id/nav_tab_search"
- tapOn: "Search Wikipedia"
- inputText: "maestro"
- assertVisible: "Maestro Mock Article"
- assertVisible: "Result served by the local fixture server"
